# NCS v3.4.1, opt-in DK candidate: west build --sysbuild --extra-conf dfu.conf.
# MCUboot's default signing private key is publicly shipped: test images only.
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU_SPEEDUP=n
CONFIG_BT_SMP=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.1.0+0"
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
