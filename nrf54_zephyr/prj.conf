CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_EXT_ADV=y
# Legacy SDK5 does not initiate PHY updates on connection (older iOS/macOS issues).
CONFIG_BT_AUTO_PHY_PERIPHERAL_NONE=y
CONFIG_POLL=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_DIS_MANUF_NAME_STR="Ruuvi Innovations Ltd"
CONFIG_BT_DIS_MODEL_NUMBER_STR="nRF54 Zephyr demo"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="0.1.0-demo"
CONFIG_HWINFO=y
CONFIG_SENSOR=y
CONFIG_GPIO=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_WATCHDOG=y
CONFIG_PICOLIBC=y
CONFIG_LOG=y
