name: Zephyr migration candidate

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  source-and-simulator:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out legacy submodules and Zephyr port
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: app
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install host test and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev qemu-system-arm

      - name: Run portable legacy parity vectors
        run: |
          cmake -S app/nrf54_zephyr/tests -B host-build -DCMAKE_BUILD_TYPE=Release
          cmake --build host-build -j2
          test -x host-build/test_aes
          ctest --test-dir host-build --output-on-failure

      - name: Set up upstream Zephyr v4.4.0
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1
        with:
          base-path: app
          app-path: nrf54_zephyr
          toolchains: arm-zephyr-eabi

      - name: Build DK and TAG-history candidates
        working-directory: app
        run: |
          APP="$PWD/nrf54_zephyr"
          west build -b nrf54l15dk/nrf54l15/cpuapp -d build/dk "$APP"
          west build -b nrf54l15tag/nrf54l15/cpuapp -d build/tag-history \
            --extra-conf "$APP/nrf54l15tag.conf" \
            --extra-conf "$APP/nrf54l15tag_history.conf" \
            --extra-dtc-overlay "$APP/nrf54l15tag.overlay" \
            --extra-dtc-overlay "$APP/nrf54l15tag_history.overlay" \
            "$APP"

      - name: Run AES, history, NFC, UI, sensor and GATT simulator cases
        working-directory: app
        run: |
          west twister -T nrf54_zephyr/tests/aes_vector \
            -T nrf54_zephyr/tests/nfc_codec \
            -p qemu_cortex_m3 -O build/twister-cm3 -i
          west twister -T nrf54_zephyr/tests/history_flash \
            -T nrf54_zephyr/tests/ui \
            -T nrf54_zephyr/tests/sensors \
            -T nrf54_zephyr/tests/gatt \
            -p mps2/an385 -O build/twister-mps2 -i

      - name: Require executed simulator coverage
        working-directory: app
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "twister-cm3": {"ruuvi.aes_vector": 1, "ruuvi.nfc_codec": 3},
              "twister-mps2": {
                  "ruuvi.history_flash.simulator": 4,
                  "ruuvi.ui.gpio_emulator": 1,
                  "ruuvi.sensors.motion_trigger": 4,
                  "ruuvi.gatt.rx_queue": 3,
                  "ruuvi.gatt.rx_queue_history": 3,
              },
          }
          for output, suites in expected.items():
              report = json.loads((Path("build") / output / "twister.json").read_text())
              actual = {suite["name"]: suite for suite in report["testsuites"]}
              if len(actual) != len(report["testsuites"]) or actual.keys() != suites.keys():
                  raise SystemExit(f"Unexpected or missing {output} suites: {list(actual)}")
              for name, count in suites.items():
                  suite = actual[name]
                  cases = suite["testcases"]
                  if (suite["status"] != "passed" or not suite["runnable"] or
                          len(cases) != count or
                          any(case["status"] != "passed" for case in cases)):
                      raise SystemExit(f"{output}/{name} did not execute {count} passing cases")
          PY

  ncs-signed-candidates:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Ruuvi sources and endpoint submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: app
          submodules: recursive
          persist-credentials: false

      - name: Check out NCS v3.4.1 manifest
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nrfconnect/sdk-nrf
          ref: v3.4.1
          path: ncs/nrf
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up NCS Zephyr and Arm SDK
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1
        with:
          base-path: ncs
          app-path: nrf
          toolchains: arm-zephyr-eabi
          west-update-flags: -o=--depth=1 -n

      - name: Install NCS build requirements
        working-directory: ncs
        run: python3 -m pip install -r nrf/scripts/requirements.txt

      - name: Build DK NFC/DFU and matched TAG history/DFU candidates
        working-directory: ncs
        run: |
          APP="$GITHUB_WORKSPACE/app/nrf54_zephyr"
          west build --sysbuild -b nrf54l15dk/nrf54l15/cpuapp -d build/dk-dfu-nfc \
            --extra-conf "$APP/dfu.conf" --extra-conf "$APP/nfc.conf" "$APP"
          west build --sysbuild -b nrf54l15tag/nrf54l15/cpuapp -d build/tag-history \
            --extra-conf "$APP/nrf54l15tag.conf" \
            --extra-conf "$APP/nrf54l15tag_history.conf" \
            --extra-conf "$APP/dfu.conf" \
            --extra-dtc-overlay "$APP/nrf54l15tag.overlay" \
            --extra-dtc-overlay "$APP/nrf54l15tag_history.overlay" "$APP" \
            -- -DSB_CONFIG_PARTITION_MANAGER=n

      - name: Check generated layouts and test-key artifacts
        working-directory: ncs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          import re

          layouts = {
              "dk-dfu-nfc": {
                  "boot_partition": (0x0, 0xF800),
                  "slot0_partition": (0x10000, 0xB2000),
                  "slot1_partition": (0xC2000, 0xB2000),
                  "storage_partition": (0x174000, 0x9000),
              },
              "tag-history": {
                  "boot_partition": (0x0, 0xF800),
                  "slot0_partition": (0x10000, 0xAA000),
                  "slot1_partition": (0xBA000, 0xAA000),
                  "ruuvi_history_partition": (0x164000, 0xF000),
                  "storage_partition": (0x173000, 0xA000),
              },
          }
          for candidate, expected in layouts.items():
              base = Path("build") / candidate
              for image in ("mcuboot", "nrf54_zephyr"):
                  dts = (base / image / "zephyr/zephyr.dts").read_text()
                  for label, location in expected.items():
                      node = re.search(
                          rf"\b{label}:\s+partition@[0-9a-f]+\s*\{{([^{{}}]*)\}}", dts
                      )
                      assert node, f"{candidate}/{image}: missing {label}"
                      reg = re.search(
                          r"\breg\s*=\s*<\s*(0x[0-9a-f]+)\s+(0x[0-9a-f]+)\s*>",
                          node.group(1),
                      )
                      assert reg and tuple(int(value, 16) for value in reg.groups()) == location, (
                          f"{candidate}/{image}: wrong {label} layout"
                      )
                  assert ("ruuvi_history_partition:" in dts) == (candidate == "tag-history")
              app_config = (base / "nrf54_zephyr/zephyr/.config").read_text()
              boot_config = (base / "mcuboot/zephyr/.config").read_text()
              assert "CONFIG_MCUMGR_GRP_IMG=y" in app_config
              assert "CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y" in app_config
              assert ("CONFIG_NFC_T4T_NRFXLIB=y" in app_config) == (candidate == "dk-dfu-nfc")
              assert "CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y" in boot_config

              signed = (base / "nrf54_zephyr/zephyr/zephyr.signed.bin").read_bytes()
              with ZipFile(base / "dfu_application.zip") as package:
                  if sorted(package.namelist()) != ["manifest.json", "nrf54_zephyr.signed.bin"]:
                      raise SystemExit(f"{candidate}: unexpected DFU ZIP members")
                  if package.read("nrf54_zephyr.signed.bin") != signed:
                      raise SystemExit(f"{candidate}: packaged image differs from signed build")
                  manifest = json.loads(package.read("manifest.json"))
              entry = manifest["files"]
              board = "nrf54l15dk" if candidate == "dk-dfu-nfc" else "nrf54l15tag"
              if (manifest["format-version"] != 1 or manifest["name"] != "nrf54_zephyr" or
                      len(entry) != 1 or entry[0]["file"] != "nrf54_zephyr.signed.bin" or
                      entry[0]["board"] != board or entry[0]["type"] != "application" or
                      entry[0]["version_MCUBOOT"] != "0.1.0+0" or
                      entry[0]["load_address"] != expected["slot0_partition"][0] or
                      entry[0]["size"] != len(signed)):
                  raise SystemExit(f"{candidate}: DFU manifest does not describe signed build")
          PY
          for candidate in dk-dfu-nfc tag-history; do
            python3 bootloader/mcuboot/scripts/imgtool.py verify \
              --key bootloader/mcuboot/root-ec-p256.pem \
              "build/$candidate/nrf54_zephyr/zephyr/zephyr.signed.bin"
            unzip -t "build/$candidate/dfu_application.zip"
          done

  sdk5-unit-baseline:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out original application and nested submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: app
          submodules: recursive
          persist-credentials: false

      - name: Fetch and verify official nRF5 SDK 15.3.0
        run: |
          archive="$RUNNER_TEMP/nRF5_SDK_15.3.0_59ac345.zip"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            https://developer.nordicsemi.com/nRF5_SDK/nRF5_SDK_v15.x.x/nRF5_SDK_15.3.0_59ac345.zip
          printf '%s  %s\n' \
            9c9307d757d109007f2fcc4e547ac10b1a9fd9faa477e8dbf3f7e1624c4801a5 \
            "$archive" | sha256sum --check
          unzip -q "$archive" -d app/nrf52_oldsdk

      - name: Run unmodified SDK5 Ceedling application tests
        working-directory: app/nrf52_oldsdk
        run: |
          ruby -e 'abort "Ceedling 1.0.1 requires Ruby 3" if RUBY_VERSION.split(".").first.to_i < 3'
          export GEM_HOME="$RUNNER_TEMP/ruuvi-ceedling"
          export GEM_PATH="$GEM_HOME"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install ceedling -v 1.0.1 --install-dir "$GEM_HOME" --no-document
          ceedling test:all
